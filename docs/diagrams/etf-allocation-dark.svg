<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etf-allocation-dark-title etf-allocation-dark-desc" id="etf-allocation-dark-root">
<title id="etf-allocation-dark-title">ETF 배분: 종목마다 어떤 주문을 계획하나</title>
<desc id="etf-allocation-dark-desc">ETF 배분 모드가 보유 종목과 목표 ETF마다 전량 매도, 초기 매수, 월초 비중 조정, 유지 중 무엇을 계획하는지 보여 주는 흐름도.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #etf-allocation-dark-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #etf-allocation-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #etf-allocation-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#etf-allocation-dark-root .diagram-container { overflow-x: visible; }
}</style>
