<!-- notes and legend -->
<text x="40" y="356" fill="#f5f5f5" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">주문은 장 마감 동시호가에 원장을 거쳐 낸다. 매도가 체결돼 슬롯(최대 2종목)이 비어야 사므로 전환은 며칠 걸릴 수 있다.</text>
<text x="40" y="380" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">계좌나 시세 조회가 하나라도 불완전한 tick에는 배분 주문을 계획하지 않는다.</text>
