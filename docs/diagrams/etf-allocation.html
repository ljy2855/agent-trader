<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 배분: 종목마다 어떤 주문을 계획하나</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · etf_allocation.py</p>
    <h1>ETF 배분: 종목마다 어떤 주문을 계획하나</h1>

    <div class="diagram-container">
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etf-allocation-title etf-allocation-desc">
<title id="etf-allocation-title">ETF 배분: 종목마다 어떤 주문을 계획하나</title>
<desc id="etf-allocation-desc">ETF 배분 모드가 보유 종목과 목표 ETF마다 전량 매도, 초기 매수, 월초 비중 조정, 유지 중 무엇을 계획하는지 보여 주는 흐름도.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- zones -->


<!-- connectors (drawn before nodes) -->
<path d="M 168,120 H 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 352,120 H 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 536,120 H 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 736,120 H 776" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 280,168 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<path d="M 656,168 V 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- connector labels -->
<rect x="358" y="100" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="372" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="542" y="100" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="556" y="109" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="742" y="100" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="756" y="109" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="288" y="202" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="298" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="472" y="202" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="482" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="664" y="202" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="674" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

<!-- nodes -->
<rect x="40" y="92" width="128" height="56" rx="20" fill="#f5f5f5"/>

<text x="104" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">종목마다</text>
<text x="104" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">holdings + 2 ETFs</text>

<polygon points="464,72 536,120 464,168 392,120" fill="#f5f5f5"/>

<text x="464" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이미 보유 중?</text>
<polygon points="656,72 736,120 656,168 576,120" fill="#f5f5f5"/>

<text x="280" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">legacy stock · any day</text>
<rect x="384" y="248" width="160" height="64" rx="6" fill="#f5f5f5"/>

<text x="464" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">47%까지 매수</text>
<text x="464" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">first entry · any day</text>

<text x="656" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">그대로 둠</text>
<text x="656" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no order</text>

<!-- notes and legend -->
<text x="40" y="356" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">주문은 장 마감 동시호가에 원장을 거쳐 낸다. 매도가 체결돼 슬롯(최대 2종목)이 비어야 사므로 전환은 며칠 걸릴 수 있다.</text>
<text x="40" y="380" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">계좌나 시세 조회가 하나라도 불완전한 tick에는 배분 주문을 계획하지 않는다.</text>
<line x1="40" y1="416" x2="920" y2="416" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>

<polygon points="266,450 278,444 290,450 278,456" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

  </div>

</html>
