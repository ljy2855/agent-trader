<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">agent-trader 구성</title>
<desc id="architecture-desc">MCP client는 MCP server로 키움을 조회하고, 주문은 Watcher만 키움에 내며, Watcher가 LLM agent에 Tier 2 판단을 묻고 원장과 status server를 함께 돌리는 구성도.</desc>
