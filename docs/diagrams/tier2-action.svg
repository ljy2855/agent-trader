      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Noto Sans Mono', ui-monospace, monospace; }
      #tier2-action-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tier2-action-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tier2-action-root .diagram-container { overflow-x: visible; }
}</style>
