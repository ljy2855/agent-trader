<title id="tier2-action-title">Tier 2: agent 판단이 주문이 되기까지</title>
<desc id="tier2-action-desc">Tier 2 트리거가 agent 응답, 두 번의 가격 확인, 보유 종목 매도의 교차검토를 거쳐 주문이 되거나 폐기되는 흐름도.</desc>
