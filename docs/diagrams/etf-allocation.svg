<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etf-allocation-title etf-allocation-desc" id="etf-allocation-root">
<title id="etf-allocation-title">ETF 배분: 종목마다 어떤 주문을 계획하나</title>
<desc id="etf-allocation-desc">ETF 배분 모드가 보유 종목과 목표 ETF마다 전량 매도, 초기 매수, 월초 비중 조정, 유지 중 무엇을 계획하는지 보여 주는 흐름도.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #etf-allocation-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #etf-allocation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #etf-allocation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#etf-allocation-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="etf-allocation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="etf-allocation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="etf-allocation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

