<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-ledger-states-dark-title order-ledger-states-dark-desc" id="order-ledger-states-dark-root">
<title id="order-ledger-states-dark-title">주문 원장의 상태</title>
<desc id="order-ledger-states-dark-desc">주문 intent가 요청 전 INTENDED로 기록된 뒤 API 응답과 브로커 대사에 따라 미해결 상태를 거쳐 FILLED·CANCELLED·REJECTED·RELEASED로 끝나는 상태도.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #order-ledger-states-dark-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #order-ledger-states-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #order-ledger-states-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#order-ledger-states-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="order-ledger-states-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="order-ledger-states-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="order-ledger-states-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
</defs>
<rect width="100%" height="100%" fill="#2d3142"/>

