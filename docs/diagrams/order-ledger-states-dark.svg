<text x="80" y="524" fill="#f5f5f5" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">대사에서 브로커 행이 보이면, 미해결 상태 어디서든 FILLED · CANCELLED · REJECTED로 바로 간다.</text>
<text x="80" y="548" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">RELEASED는 응답을 잃은 보호 매도만: 120초 유예 뒤, 30초 이상 간격의 완전한 조회 3번에 모두 없을 때. 매수는 다시 보내지 않는다.</text>
